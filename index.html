<script>

const area =
  document.getElementById("buttonArea");

const grade1 =
  document.getElementById("grade1");

const grade5 =
  document.getElementById("grade5");

const status =
  document.getElementById("status");

let attempts = 0;


/* ============================
   RESEARCH MESSAGES
============================ */

const messages = [

  "⚠️ Response rejected. Please try again.",

  "📊 Grade 5 has been identified as an outlier.",

  "🔬 Insufficient evidence to support Grade 5.",

  "💻 ERROR 404: Grade 5 not found.",

  "🧪 Grade 5 failed data validation.",

  "📈 Findings strongly favor Grade 1.",

  "😭 Sir Maven... the data is becoming very clear.",

  "🏃 Grade 5 has withdrawn from the study.",

  "😂 Please consider the remaining valid response."

];


/* ============================
   POSSIBLE LOCATIONS FOR 5

   It jumps FAR AWAY instead
   of moving randomly nearby.
============================ */

const positions = [

  {
    left: "68%",
    top: "15%"
  },

  {
    left: "68%",
    top: "70%"
  },

  {
    left: "40%",
    top: "5%"
  },

  {
    left: "40%",
    top: "75%"
  },

  {
    left: "72%",
    top: "42%"
  }

];


let currentPosition = 4;


/* ============================
   MOVE 5 FAR AWAY
============================ */

function moveFiveAway(
  fingerX,
  fingerY
) {

  attempts++;


  const areaRect =
    area.getBoundingClientRect();


  /*
    Convert every possible
    location into screen
    coordinates.

    Then find which one is
    FARTHEST from the finger.
  */

  let bestPosition = null;

  let greatestDistance = -1;


  positions.forEach(
    function(position, index) {


      /*
        Don't use the exact
        same position again.
      */

      if (
        index === currentPosition
      ) {

        return;

      }


      const xPercent =
        parseFloat(
          position.left
        ) / 100;


      const yPercent =
        parseFloat(
          position.top
        ) / 100;


      const positionX =
        areaRect.left +
        areaRect.width *
        xPercent;


      const positionY =
        areaRect.top +
        areaRect.height *
        yPercent;


      const distance =
        Math.sqrt(

          Math.pow(
            fingerX - positionX,
            2
          )

          +

          Math.pow(
            fingerY - positionY,
            2
          )

        );


      /*
        Pick the location
        farthest away.
      */

      if (
        distance >
        greatestDistance
      ) {

        greatestDistance =
          distance;

        bestPosition =
          {
            position:
              position,

            index:
              index
          };

      }

    }
  );


  /*
    Move instantly.
  */

  if (bestPosition) {

    grade5.style.left =
      bestPosition
      .position
      .left;


    grade5.style.top =
      bestPosition
      .position
      .top;


    currentPosition =
      bestPosition.index;

  }


  /*
    Update funny message.
  */

  status.textContent =

    messages[

      (attempts - 1)
      %
      messages.length

    ];

}


/* ============================
   DISTANCE CHECK

   Check how close the
   finger/mouse is to 5.
============================ */

function checkDistance(
  clientX,
  clientY
) {


  const fiveRect =
    grade5
    .getBoundingClientRect();


  const centerX =
    fiveRect.left +
    fiveRect.width / 2;


  const centerY =
    fiveRect.top +
    fiveRect.height / 2;


  const distance =
    Math.sqrt(

      Math.pow(
        clientX - centerX,
        2
      )

      +

      Math.pow(
        clientY - centerY,
        2
      )

    );


  /*
    IMPORTANT:

    130px detection radius.

    This is MUCH bigger than
    the visible Grade 5.
  */

  if (distance < 130) {

    moveFiveAway(
      clientX,
      clientY
    );

    return true;

  }


  return false;

}


/* ============================
   COMPUTER

   Continuously watch
   mouse position.
============================ */

area.addEventListener(

  "mousemove",

  function(event) {

    checkDistance(
      event.clientX,
      event.clientY
    );

  }

);


/* ============================
   PHONE

   Detect first contact
   anywhere in answer area.
============================ */

area.addEventListener(

  "pointerdown",

  function(event) {


    /*
      Grade 1 remains clickable.
    */

    if (
      event.target === grade1
    ) {

      return;

    }


    const nearFive =
      checkDistance(
        event.clientX,
        event.clientY
      );


    if (nearFive) {

      event.preventDefault();

      event.stopPropagation();

    }

  },

  true

);


/* ============================
   TOUCHSCREEN BACKUP
============================ */

area.addEventListener(

  "touchstart",

  function(event) {


    if (
      event.target === grade1
    ) {

      return;

    }


    const touch =
      event.touches[0];


    if (!touch) {

      return;

    }


    const nearFive =
      checkDistance(
        touch.clientX,
        touch.clientY
      );


    if (nearFive) {

      event.preventDefault();

      event.stopPropagation();

    }

  },

  {
    passive: false,
    capture: true
  }

);


/* ============================
   GRADE 1
============================ */

grade1.addEventListener(

  "click",

  function() {


    document.getElementById(
      "mainCard"
    ).innerHTML = `


      <span class="label">

        IT RESEARCH • STUDY COMPLETED

      </span>


      <h1>

        Response Received! ✅

      </h1>


      <p class="intro">

        Thank you for participating
        in our very important study,
        Sir Maven. 😂

        <br><br>

        Your response has been
        successfully recorded
        and validated.

      </p>


      <div class="result-box">


        <small>

          CONFIRMED RECEIVED GRADE

        </small>


        <div class="final-grade">

          1.00 🎓

        </div>


        <strong>

          Data successfully
          validated. ✅

        </strong>


      </div>


      <p>

        <strong>
          📊 Research Finding
        </strong>

        <br><br>

        Grade 1 was the only response
        successfully validated by
        the research instrument.

      </p>


      <p>

        <strong>
          🔬 Conclusion
        </strong>

        <br><br>

        The gathered data provides
        sufficient evidence to accept
        Grade 1 and reject Grade 5. 😂

      </p>


      <p>

        <strong>
          📋 Recommendation
        </strong>

        <br><br>

        No further data collection
        is recommended today.

        <br><br>

        Sir Maven should now proceed
        to the next phase:

      </p>


      <h2>

        REST 🛌

        <br>
        ↓
        <br>

        RECOVER ❤️

        <br>
        ↓
        <br>

        GET WELL SOON! 💪

      </h2>


      <hr>


      <p class="intro">

        Jokes aside, Sir Maven,
        we hope you get plenty of rest
        and feel much better soon.

        <br><br>

        Enjoy your well-deserved
        rest day, Sir! ❤️

        <br><br>

        — Your IT Research Students

      </p>


      <p class="footer">

        <strong>
          Limitation of the Study:
        </strong>

        <br><br>

        Grade 5 was included
        as a possible response
        but repeatedly refused
        to participate. 🏃💨

      </p>

    `;

  }

);

</script>
